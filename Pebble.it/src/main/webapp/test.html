<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div Layout</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            display: flex;
            flex-direction: column;
            width: 300px;
            height: 600px;
            border: 2px solid black;
        }
        .row {
            display: flex;
            flex: 1;
        }
        .box {
            flex: 1;
            border: 1px solid black;
            background-color: lightgray;
        }
        .box:nth-child(2) {
            flex: 2; /* 두 번째 박스의 크기를 두 배로 설정 */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="box"></div>
            <div class="box"></div>
        </div>
        <div class="row">
            <div class="box"></div>
        </div>
        <div class="row">
            <div class="box"></div>
            <div class="box"></div>
        </div>
    </div>
</body>
</html>
