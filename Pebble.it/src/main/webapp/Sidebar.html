        </tr>
        <tr>
          <td colspan="2">

    </div>
    <nav class="sidebar-menu">

        <tr class="tr_line">

        </tr>
        <tr>

        </tr>
        <tr>
          <td>
            <div class="button-container">
              <button id="cancel-button" class="close">취소</button>

            </div>
          </td>

      </table>
