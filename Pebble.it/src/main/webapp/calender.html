<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pebble.it</title>

  <!-- FullCalendar Library -->
  <script src="resources/js/index.global.min.js"></script>

  <!-- jQuery 추가 -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- Stylesheets -->
  <!-- 사이드바 스타일 시트 -->
  <link rel="stylesheet" href="resources/css/Sidebar.css"> 
  <!-- 캘린더와 메인 레이아웃 관련 스타일 -->
  <link rel="stylesheet" href="resources/css/we_calender.css">
</head>

<body>

  <!-- 레이아웃 컨테이너 -->
  <div class="layout">
    <!-- 사이드바 로드 -->
    <div class="sidebar">
      <script>
        $(document).ready(function () {
            $(".sidebar").load("Sidebar.html", function(response, status, xhr) {
                if (status == "error") {
                    // 만약 Sidebar.html이 로드되지 않으면 Sidebar.htm으로 대체 시도
                    $(".sidebar").load("/Pebble.it/Sidebar.htm");
                }
            });
        });
    </script>
    </div>

    <!-- 메인 콘텐츠 영역 -->
    <div class="main-content">
      <!-- 캘린더 상단 툴바 -->
      <div class="calendar-toolbar">
        <!-- 일정 등록 버튼  -->
        <button id="scheduleBtn" class="schedule-btn">+ 일정 등록</button>

        <div class="calendar-nav">
          <!-- 달을 넘기는 버튼  -->
          <button id="prevMonth" class="calendar-nav-btn"><</button>
          <button id="nextMonth" class="calendar-nav-btn">></button>
          <button id="today" class="calendar-nav-btn">오늘</button>
        </div>
      </div>

      <!-- 캘린더 영역 -->
      <div id="calendar-wrap">
        <div id="calendar"></div>
      </div>
    </div>
  </div>

    <script src="resources/js/we_calender.js"></script>
</body>

</html>
