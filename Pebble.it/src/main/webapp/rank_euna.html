<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pebble.it</title>

    <!-- jQuery 추가 -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- 사이드바 -->
    <link rel="stylesheet" href="resources/css/Sidebar.css" />

    <!-- 메인 레이아웃 관련 스타일 -->
    <link rel="stylesheet" href="resources/css/rank_euna.css" />
    <!-- 홈 컨텐츠 관련 CSS -->

    <link rel="stylesheet" href="https://uicdn.toast.com/chart/latest/toastui-chart.min.css">
    <script src="https://uicdn.toast.com/chart/latest/toastui-chart.min.js"></script>
</head>

<body>
    <!-- 사이드바 로드 -->
    <div class="sidebar">
        <script>
            $(document).ready(function () {
                $(".sidebar").load("Sidebar.html", function (response, status, xhr) {
                    if (status == "error") {
                        $(".sidebar").load("/Pebble.it/Sidebar.htm");
                    }
                });
            });
        </script>
    </div>

    <!-- 메인 콘텐츠 영역 -->
    <div class="main-content">
        <!-- 콘텐츠 컨테이너 -->
        <div class="content-container">
            <!-- 왼쪽 콘텐츠 영역 -->
            <div class="left-content">
                <!-- 왼쪽 상단 콘텐츠 박스 -->
                <div class="content-box">
                    <div class="content-header">
                        <h2 class="content-title">내 달성률</h2>
                    </div>
                    <div class="content-body">
                        <p>여기에 왼쪽 상단 콘텐츠 내용이 들어갑니다.</p>
                    </div>
                </div>

                <!-- 왼쪽 하단 콘텐츠 박스 -->
                <div class="content-box">
                    <div class="content-header">
                        <h2 class="content-title">내 뱃지</h2>
                    </div>
                    <div class="content-body">
                        <div class="achievement-container">
                            <div class="achievement-item">
                                <img src="resources/img/badge_icons1-1.web" alt="일정">
                                <span>일정 10개 등록</span>
                            </div>
                            <div class="achievement-item">
                                <img src="resources/img/badge_icons2-1.web" alt="할 일">
                                <span>할 일 10개 완료</span>
                            </div>
                            <div class="achievement-item">
                                <img src="resources/img/badge_icons3-1.web" alt="기록">
                                <span>나의 기록 3일 이상 작성</span>
                            </div>
                            <div class="achievement-item">
                                <img src="resources/img/badge_icons4-1.web" alt="포인트">
                                <span>일일 포인트 20점 획득</span>
                            </div>
                            <div class="achievement-item">
                                <img src="resources/img/badge_icons5-1.web" alt="누적">
                                <span>누적 포인트 100점 획득</span>
                            </div>
                            <div class="achievement-item">
                                <img src="resources/img/badge_icons6-1.web" alt="순위">
                                <span>포인트 순위 1위 달성</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 오른쪽 콘텐츠 영역 -->
            <div class="right-content">
                <div class="content-box">
                    <div class="content-header">
                        <h2 class="content-title">포인트 순위</h2>
                        <img class="info-icon" src="resources/img/impormation.png" alt="정보 아이콘" />
                    </div>
                    <div class="content-body">
                        <p>여기에 오른쪽 콘텐츠 내용이 들어갑니다.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
