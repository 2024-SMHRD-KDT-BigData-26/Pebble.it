<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pebble.it</title>
  <link rel="stylesheet" href="resources/css/Main.css"> <!-- 외부 CSS 파일 연결 -->
</head>
<body>
    <!-- 왼쪽 섹션: 이미지 배경 -->
    <div class="left_section">
        <div class="left_text">Make it happen!</div> <!-- 동기 부여 텍스트 -->
    </div>

    <!-- 오른쪽 섹션: 회원가입 폼 -->
    <div class="right_section">
        <p class="subtitle">나만의 운동 일정 플랫폼</p> <!-- 부제목 -->
        <h2 class="main-title">Pebble.it</h2> <!-- 메인 제목 -->

        <!-- 프로필 사진 업로드 -->
        <form>
            <div class="profile_img">
                <!-- 프로필 업로드를 위한 버튼 (라벨을 클릭하면 파일 업로드 창 열림) -->
                <label for="profile-upload">프로필 사진 선택</label>
                <input id="profile-upload" type="file" style="display: none;" /> <!-- 파일 선택 숨김 -->
            </div>

            <!-- 닉네임 입력 -->
            <div class="Join">
                <input type="text" placeholder="닉네임을 입력하세요 (1~8자 영문, 한글, 숫자)" required> <!-- 닉네임 입력 -->
                <button type="button" class="check-btn">중복확인</button> <!-- 닉네임 중복 확인 버튼 -->
            </div>

            <!-- 아이디 입력 -->
            <div class="Join">
                <input type="text" placeholder="아이디를 입력하세요 (5~10자의 영문 소문자, 숫자)" required> <!-- 아이디 입력 -->
                <button type="button" class="check-btn">중복확인</button> <!-- 아이디 중복 확인 버튼 -->
            </div>

            <!-- 비밀번호 입력 -->
            <div class="Join">
                <input type="password" id="password" placeholder="비밀번호를 입력하세요(8~16자의 영문 대/소문자, 숫자)" required> <!-- 비밀번호 입력 -->
                <small class="error-message" id="password-error" style="display: none; color: red;">
                    조건에 맞지 않는 비밀번호입니다.
                </small> <!-- 조건 불만족 시 에러 메시지 -->
            </div>

            <!-- 관심 운동 선택 -->
            <div class="sport_check">
                <p> | 관심 운동 선택 (택1)</p>
                <label><input type="radio" name="sport" value="헬스">헬스</label>
                <label><input type="radio" name="sport" value="수영">수영</label>
                <label><input type="radio" name="sport" value="테니스">테니스</label>
            </div>

            <!-- 운동 수준 선택 -->
            <div class="sport_check">
                <p> | 나의 운동 수준(택1)</p>
                <label><input type="radio" name="my_level" value="lev1">초급자</label>
                <label><input type="radio" name="my_level" value="lev2">중급자</label>
                <label><input type="radio" name="my_level" value="lev3">전문가</label>
            </div>


             <!-- 버튼 영역 -->
             <div class="buttons">
                <button type="button" class="cancel-btn">취소</button> <!-- 취소 버튼 -->
                <button type="submit" class="join-btn">회원가입</button> <!-- 회원가입 버튼 -->
            </div>
        </form>
    </div>
</body>
</html>
