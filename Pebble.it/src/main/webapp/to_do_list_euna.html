<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pebble.it</title>

    <!-- FullCalendar Library -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.7/index.global.min.js"></script>

    <!-- jQuery 추가 -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- CSS 연결 -->
    <link rel="stylesheet" href="resources/css/Sidebar.css"> <!-- 사이드바 스타일 -->
    <link rel="stylesheet" href="resources/css/to_do_list_euna.css"> <!-- 메인 콘텐츠 스타일 -->
</head>

<body>
    <!-- 레이아웃 컨테이너 -->
    <div class="layout">
        <!-- 사이드바 -->
        <div class="sidebar">
            <script>
                $(document).ready(function () {
                    $(".sidebar").load("sidebar.html"); // 사이드바를 외부 파일에서 로드
                });
            </script>
        </div>

        <!-- 메인 콘텐츠 영역 -->
        <div class="main-content">
            <!-- 상단 툴바 -->
            <div class="calendar-toolbar">
                <button id="scheduleBtn" class="schedule-btn">+ 할일 등록</button> <!-- 할일 등록 버튼 -->
            </div>

            <!-- 콘텐츠 영역: 왼쪽과 오른쪽 나뉨 -->
            <div class="content-wrapper">
                <!-- 왼쪽 콘텐츠 -->
                <div class="left-content">
                    <h3>할일 목록</h3>
                    <ul class="todo-list">
                        <li>수영장에서 숨쉬기 연습하기</li>
                        <li>준비 운동 꼭 하자!</li>
                        <li>팔 동작 완벽히 하기</li>
                        
                        <!-- 추가 항목은 여기 삽입 -->
                    </ul>
                    <div class="pagination">
                        <!-- 왼쪽 하단: 페이지 정보 -->
                        <div class="page-info">
                            <span id="page-info">1</span> / <span id="total-pages">20</span>
                        </div>
            
                        <!-- 오른쪽 하단: 이전 및 다음 버튼 -->
                        <div class="page-buttons">
                            <button id="prev-page" class="pagination-btn"><</button>
                            <button id="next-page" class="pagination-btn">></button>
                        </div>
                    </div>
                </div>
            
                <!-- 오른쪽 콘텐츠 -->
                <div class="right-content">
                    <h3>추천 할일</h3>
                    <p>
                        수영 초보자를 위한 배영 연습 투두리스트 3가지:
                    <ol>
                        <li>기본 자세 익히기</li>
                        <li>다리 킥 연습</li>
                        <li>팔 동작 연습</li>

                    </ol>
                    오늘도 할 수 있어요! 힘내세요! 😊
                    </p>
                </div>
            </div>
            

        <!-- JavaScript 파일 연결 -->
        <script src="resources/js/to_do_list.js"></script>
</body>

</html>
